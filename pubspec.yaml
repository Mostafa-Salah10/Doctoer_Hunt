name: doctor_hunt
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dotted_border: ^3.0.0
  equatable: ^2.1.0
  expandable_page_view: ^1.3.0
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.3.0
  fluttertoast: ^9.0.0
  get_it: ^9.2.1
  go_router: ^17.1.0
  pinput: ^6.0.2
  shared_preferences: ^2.5.5
  slang: ^4.19.0
  slang_flutter: ^4.19.0
  svg_flutter: ^0.0.1
  cloud_firestore: ^6.9.0
  table_calendar: ^3.2.1

dev_dependencies:
  build_runner: null
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter
  slang_build_runner: ^4.19.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/launchers/
    - assets/svgs/

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf

    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf

flutter_assets:
  assets_path: assets/
  output_path: lib/core/utils/
  filename: assets.dart
